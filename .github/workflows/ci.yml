name: Fleet Tracker CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Verify fresh development startup
        shell: bash
        run: |
          rm -f data.db data.db-shm data.db-wal data.db-journal
          PORT=5000 npm run dev > dev-server.log 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat dev-server.log
              exit 1
            fi
            sleep 0.5
          done

          curl --fail --silent http://127.0.0.1:5000/api/health
          cleanup
          trap - EXIT

      - name: Production build
        run: npm run build

      - name: Production API and lifecycle smoke tests
        shell: bash
        run: |
          rm -f data.db data.db-shm data.db-wal data.db-journal
          PORT=5000 npm start > prod-server.log 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health > /dev/null; then
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat prod-server.log
              exit 1
            fi
            sleep 0.5
          done

          npm run test:smoke
          cleanup
          trap - EXIT

      - name: Print server logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- development server ---'
          cat dev-server.log 2>/dev/null || true
          echo '--- production server ---'
          cat prod-server.log 2>/dev/null || true
